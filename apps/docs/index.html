      rel="stylesheet"
    />

    <meta
      name="description"
      content="Yukino is a terminal-based AI coding agent. Chat with any LLM, edit files, run commands, and orchestrate multi-agent workflows — all from one CLI."
    />
    <link rel="canonical" href="https://hangtiancheng.github.io/yukino-code/" />
    <meta
      property="og:title"
      content="Yukino — The AI coding agent that lives in your terminal"
    />

    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Yukino — The AI coding agent that lives in your terminal"
    />
    <meta
      name="twitter:description"
      content="Multi-provider LLMs, a rich streaming TUI, sandboxed tools, long-term memory and multi-agent teams — in a single CLI."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Yukino",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": ["macOS", "Linux", "Windows"],
        "url": "https://github.com/hangtiancheng/yukino-code",
        "license": "https://opensource.org/licenses/MIT",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Yukino is a terminal-based AI coding agent. Chat with any LLM, edit files, run commands, and orchestrate multi-agent workflows — all from one CLI."
      }
    </script>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("yukino-theme");
          const dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
