<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Yukino Remote</title>
    <meta name="theme-color" content="#14171a" />
    <script>
      // Set the color scheme before first paint to avoid a flash. Mirrors the
      // logic in hooks/use-theme.ts: explicit choice wins, else system pref,
      // else dark (the terminal UI default).
      (function () {
        try {
          var stored = localStorage.getItem("yukino-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="/static/index.css" />
    <style>
      body {
        margin: 0;
        background: #14171a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/static/index.js"></script>
  </body>
</html>
